PS1FirmwareVersion = Προς το παρόν, τα παιχνίδια PS1 λειτουργούν μόνο με firmware 6.00 έως 6.61 (τα μετατρεμμένα και με 3.95 έως 5.55), και είναι εγκατεστημένη διαφορετική έκδοση. Εγκαταστήστε μία από αυτές από ένα επίσημο αρχείο ενημέρωσης PSP στο Ρυθμίσεις > Εργαλεία > PSP Firmware.  # AI translated
PS1NoFirmware = Τα παιχνίδια PS1 χρειάζονται τον εξομοιωτή PS1 που περιέχεται στο firmware του PSP, και δεν είναι εγκατεστημένο κανένα firmware. Εγκαταστήστε firmware 6.00 έως 6.61 από ένα επίσημο αρχείο ενημέρωσης PSP στο Ρυθμίσεις > Εργαλεία > PSP Firmware. Η εκκίνηση ενός παιχνιδιού PSP του οποίου ο δίσκος περιέχει πρόγραμμα ενημέρωσης εγκαθιστά επίσης το firmware του.  # AI translated
PS1NoMediaEngine = Τα παιχνίδια PS1 χρειάζονται το Media Engine του PSP, το οποίο το PPSSPP δεν μπορεί ακόμη να εξομοιώσει σε αυτήν την πλατφόρμα.  # AI translated
PSP firmware version %1 or later must be installed to play UMD video = Για την αναπαραγωγή βίντεο UMD πρέπει να είναι εγκατεστημένο το υλικολογισμικό PSP έκδοσης %1 ή νεότερης # AI translated
