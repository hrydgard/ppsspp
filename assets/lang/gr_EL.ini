GenericBackendSwitchCrash = Το PPSSPP κράσαρε κατά την εκκίνηση.\n\nΣυνήθως αυτό σημαίνει πρόβλημα με τον οδηγό γραφικών. Δοκιμάστε να αναβαθμίσετε τους οδηγούς γραφικών.\n\nΤο σύστημα γραφικών άλλαξε σε:  # AI translated
